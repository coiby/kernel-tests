defaults {
        user_friendly_names yes
        find_multipaths yes
}
devices {
    device {
        vendor "NVME"
        product "NetApp E-Series"
        path_grouping_policy group_by_prio
        prio ontap
	path_selector "round-robin 0"
        failback immediate
        no_path_retry queue
        detect_checker no
        }
}
blacklist {
}
